name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add MSVC to PATH
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        run: python build.py

      - uses: actions/upload-artifact@v4
        with:
          name: BlancoVision.addon
          path: |
            BlancoVision.addon
            BlancoVision.addon.ini
            examples/BlancoVision_Control.fx
